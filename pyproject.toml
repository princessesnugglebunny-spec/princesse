[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "princesse"
version = "0.1.0"
description = "Original agent runtime distilled from agent-zero, hermes-agent, OpenManus, model-loader, llama-optim, slutt"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "rich>=13",
  "httpx>=0.27",
]

[project.optional-dependencies]
ui = []
dev = ["pytest>=8"]

[project.scripts]
princesse = "princesse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["princesse*"]
